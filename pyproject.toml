[project]
name = "lead-assistant"
version = "0.1.0"
description = "AI lead assistant for Zoho CRM: RAG over course documents, LangGraph agent, n8n orchestration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0",
    "langchain-text-splitters>=1.0",
    "langchain-google-genai>=4.0",
    "langchain-anthropic>=1.7",
    "langchain-huggingface>=1.2",
    "sentence-transformers>=5.0",
    "langchain-chroma>=1.0",
    "chromadb>=1.0",
    "pypdf>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
lead-ingest = "lead_assistant.ingest:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
